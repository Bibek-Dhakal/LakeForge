name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[dev,spark,serving]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (unit + Spark integration)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build --target serving -t lakeforge-serving .
      - name: Build pipeline image
        run: docker build --target pipeline -t lakeforge-pipeline .
