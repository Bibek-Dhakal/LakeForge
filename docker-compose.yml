x-airflow-prod-common: &airflow-prod-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    LAKE_ROOT: /data/lake
    SOURCE_DB_PATH: /data/source/reference.db
    CONFIG_DIR: /opt/lakeforge/config
  volumes:
    - lake:/data/lake
    - source:/data/source

services:
  api:
    build:
      context: .
      target: serving
    env_file: .env
    environment:
      LAKE_ROOT: /data/lake
      CONFIG_DIR: /app/config
    volumes:
      - lake:/data/lake
    ports:
      - "8000:8000"

  pipeline:
    profiles: ["tools"]
    build:
      context: .
      target: pipeline
    env_file: .env
    environment:
      LAKE_ROOT: /data/lake
      SOURCE_DB_PATH: /data/source/reference.db
      CONFIG_DIR: /app/config
    volumes:
      - lake:/data/lake
      - source:/data/source

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      LAKE_ROOT: /data/lake
      SOURCE_DB_PATH: /data/source/reference.db
      CONFIG_DIR: /app/config
    volumes:
      - .:/app
      - lake:/data/lake
      - source:/data/source

  # --- Lightweight Airflow (SQLite) ---
  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: standalone
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      LAKE_ROOT: /data/lake
      SOURCE_DB_PATH: /data/source/reference.db
      CONFIG_DIR: /opt/lakeforge/config
    volumes:
      - lake:/data/lake
      - source:/data/source
    ports:
      - "8080:8080"

  # --- Production Airflow (PostgreSQL + LocalExecutor) ---
  postgres:
    profiles: ["orchestration-prod"]
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-prod-common
    profiles: ["orchestration-prod"]
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-prod-common
    profiles: ["orchestration-prod"]
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-prod-common
    profiles: ["orchestration-prod"]
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  lake:
  source:
  postgres_data:
